<style>
  :root{--paper:#FFFFFF;--ink:#2E2C29;--muted:#7A746B;--line:#E8E6E1;--green:#2F7A57;--marigold:#E0A92E;--soft:#F7F6F3}
  :root[data-theme="dark"]{--paper:#141416;--ink:#F2F0EC;--muted:#BDB7AE;--line:#2C2C31;--green:#5FB58A;--marigold:#F0BE4E;--soft:#1E1E22}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Inter Tight",system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100svh}
  header{display:flex;justify-content:space-between;align-items:center;padding:22px 26px}
  .mark{font-weight:800;font-size:22px;letter-spacing:-0.04em;color:var(--ink);text-decoration:none}
  .mark i{font-style:normal;color:var(--green)}
  .theme{width:44px;height:44px;margin-right:-8px;border:0;border-radius:50%;background:none;color:var(--ink);cursor:pointer;display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
  .theme svg{width:24px;height:24px}.theme .i-sun{display:none}:root[data-theme="dark"] .theme .i-sun{display:block}:root[data-theme="dark"] .theme .i-moon{display:none}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px 10vh;text-align:center}
  .hi{margin:0 0 14px;font-size:15px;font-weight:500;color:var(--muted);opacity:0;animation:up .7s ease .1s forwards}
  h1{margin:0;font-size:clamp(40px,9vw,76px);line-height:1;font-weight:800;letter-spacing:-0.045em;opacity:0;animation:up .8s ease .25s forwards}
  h1 .or{color:var(--muted);font-weight:500}
  .choices{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;opacity:0;animation:up .8s ease .45s forwards}
  .choice{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;width:min(calc(50vw - 30px),220px);padding:24px 14px 20px;border-radius:24px;border:1px solid var(--line);background:var(--paper);color:var(--ink);text-decoration:none;box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.06);transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
  .choice b{font-size:clamp(26px,5vw,34px);font-weight:800;letter-spacing:-0.03em}
  .choice span{font-size:13.5px;color:var(--muted);line-height:1.35}
  .choice .dot{width:12px;height:12px;border-radius:50%;margin-bottom:6px}
  .work .dot{background:var(--green)}
  .play .dot{background:var(--marigold)}
  .choice:hover,.choice:focus-visible{transform:translateY(-3px);box-shadow:0 2px 4px rgba(0,0,0,.05),0 18px 40px rgba(0,0,0,.1);outline:none}
  .work:hover,.work:focus-visible{border-color:var(--green)}
  .play:hover,.play:focus-visible{border-color:var(--marigold)}
  .choice:active{transform:translateY(0) scale(.98)}
  .note{margin:34px 0 0;font-size:13px;color:var(--muted);opacity:0;animation:up .8s ease .65s forwards}
  .pick{color:var(--ink);text-decoration:none;position:relative;display:inline-block;transition:color .25s ease,transform .25s ease}
  .pick::after{content:"";position:absolute;left:0;right:0;bottom:-.06em;height:.07em;border-radius:.04em;background:currentColor;opacity:.16;transition:opacity .3s ease}
  .pick:hover,.pick:focus-visible{outline:none;transform:translateY(-2px)}
  .pick:hover::after,.pick:focus-visible::after{opacity:1}
  .work:hover,.work:focus-visible{color:var(--green)}
  .play:hover,.play:focus-visible{color:var(--marigold)}
  .pick:active{transform:scale(.97)}
  .q{color:var(--ink)}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.hi,h1,.choices,.note{animation:none;opacity:1}.choice{transition:none}}
</style>

// carry the light or dark choice to the other pages, even where the browser can't store it
var sel='a[href^="work/"],a[href^="story/"],a[href^="../index.html"],a[href^="../../index.html"]';
function sync(){var t=document.documentElement.dataset.theme;document.querySelectorAll(sel).forEach(function(a){var h=a.getAttribute('href'),i=h.indexOf('#'),base=i<0?h:h.slice(0,i),hash=i<0?'':h.slice(i);base=base.replace(/\?theme=(dark|light)/,'');a.setAttribute('href',base+'?theme='+t+hash);});}
